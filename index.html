<title>Pedacinho do Céu | Curadoria de Enxoval</title>

<style>
:root{--bg:#926B4B;--blue:#ADB8C7;--brown:#5e4230;--cream:#F2EFEA;--ink:#6f4f36;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Poppins',system-ui,sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:44px 22px 40px;display:flex;flex-direction:column;align-items:center}
.icon{width:130px;height:auto}
h1{font-family:'Marcellus',Georgia,serif;font-weight:400;font-size:30px;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 8px;text-align:center;line-height:1.15}
.tag{font-size:11px;letter-spacing:.32em;text-transform:uppercase;font-weight:500;margin:0 0 34px;text-align:center}
h2{align-self:stretch;font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:500;margin:22px 0 12px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--cream);opacity:.55}
a.btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--blue);color:var(--brown);text-decoration:none;padding:17px 22px;border-radius:999px;margin-bottom:12px;font-weight:500;font-size:15px;letter-spacing:.03em;transition:transform .15s,background .15s;box-shadow:0 2px 0 rgba(0,0,0,.12)}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);background:#c1cad6;outline:none}
a.btn.alt{background:var(--cream);color:var(--brown)}
a.btn.alt:hover{background:#fff}
a.btn span.ar{font-size:18px;opacity:.8}
footer{margin-top:30px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
